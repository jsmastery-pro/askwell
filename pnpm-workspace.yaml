packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  core-js: false # posthog-js dependency; its postinstall is only a donation banner

supportedArchitectures:
  os:
    - darwin
    - linux
  cpu:
    - arm64
    - x64
  libc:
    - glibc
    - musl

catalog:
  typescript: ^6.0.3
  vitest: ^5.0.3
  eslint: ^10.12.0
  "@eslint/js": ^10.0.1
  typescript-eslint: ^8.71.1
  turbo: ^2.11.7
  esbuild: ^0.28.2
  "@types/node": ^22.20.5
  "@electric-sql/pglite": ^0.5.8
  "@electric-sql/pglite-pgvector": ^0.0.9
  zod: ^4.6.5
